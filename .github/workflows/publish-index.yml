# Rebuild the catalog from scratch (seed files + Flathub + the distros' AppStream
# data + whistle-recipes + winget) and
# publish it as the `index.json` asset of the `index` release, which is where
# `whistle update` downloads it from.
name: Publish index

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-index
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      WHISTLE_RECIPES_DIR: ${{ github.workspace }}/whistle-recipes
      WHISTLE_SQLITE_PATH: ${{ github.workspace }}/catalog.sqlite3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: thisisroot/whistle-recipes
          path: whistle-recipes
      - uses: astral-sh/setup-uv@v10.3.3
      # Fedora's AppStream data comes in a zstd-compressed RPM; minisign signs the index.
      - run: sudo apt-get update && sudo apt-get install -y zstd minisign
      - run: uv sync --locked

      - name: Test
        run: uv run python manage.py test

      - name: Build the catalog
        run: |
          uv run python manage.py migrate --noinput
          uv run python manage.py import_index seed/apps.json
          uv run python manage.py ingest_flathub
          uv run python manage.py ingest_appstream
          uv run python manage.py index_recipes "$WHISTLE_RECIPES_DIR" --status-file seed/recipe-status.json
          # After the hand-written recipes, which win over generated ones.
          uv run python manage.py ingest_winget "$RUNNER_TEMP/winget-pkgs"
          # catalog.json is the full catalog. Whistle 0.1 reads index.json, and
          # rejects recipe statuses it doesn't know, so that one leaves out the
          # generated recipes, and the Windows-only apps they were for.
          uv run python manage.py build_index catalog.json
          uv run python manage.py build_index index.json --exclude-status untested --exclude-kind winget
          gzip -9 --keep --no-name catalog.json

      # Clients refuse an index that isn't signed with the key built into them
      # (keys/index.pub here).
      - name: Sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::error::The MINISIGN_SECRET_KEY secret is not set"
            exit 1
          fi
          key="$RUNNER_TEMP/index.key"
          (umask 077 && printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key")
          for file in catalog.json index.json; do
            minisign -S -s "$key" -m "$file" -t "whistle catalog index"
          done
          shred -u "$key"
          minisign -V -p keys/index.pub -m catalog.json
          minisign -V -p keys/index.pub -m index.json

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view index >/dev/null 2>&1 || gh release create index \
            --title "Catalog index" --latest=false \
            --notes "Rebuilt automatically. Clients fetch catalog.json.gz (Whistle 0.1: index.json) and its signature from here."
          gh release upload index --clobber \
            catalog.json catalog.json.gz catalog.json.minisig index.json index.json.minisig
