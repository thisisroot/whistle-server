[project]
name = "whistle-server"
version = "0.1.0"
description = "Whistle registry: catalog, recipes, compat reports, index builder"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "django>=5.2,<7",
    "whistle-recipes",
]

# TODO: add `postgres = ["psycopg[binary]>=3.2"]` under [project.optional-dependencies]
# before deploying; settings.py switches to Postgres when POSTGRES_DB is set.

[tool.uv]
package = false

[tool.uv.sources]
# Single source of truth for the recipe schema. To work on both repos at once,
# temporarily swap in: { path = "../whistle-recipes", editable = true }
whistle-recipes = { git = "https://github.com/thisisroot/whistle-recipes.git", branch = "main" }
